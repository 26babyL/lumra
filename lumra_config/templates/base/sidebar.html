{% load static %}
<!--
  LUMRA SIDEBAR — v6.0 DaisyUI Version
-->
<aside class="drawer drawer-start lg:drawer-open bg-base-100 border-r border-base-300 shadow-2xl fixed top-0 left-0 w-[72px] lg:w-[260px] h-screen z-40 transition-all duration-300 ease-in-out"
       :class="sidebarOpen ? 'w-[260px]' : 'w-[72px]'" 
       x-data="sidebarApp()" 
       x-init="init()" 
       x-cloak>
  
  <!-- Sidebar Logo Header -->
  <div class="flex items-center justify-center p-3.5 border-b border-base-300 flex-shrink-0">
    <a href="{% url 'dashboard' %}" 
       class="flex items-center gap-2.5 text-decoration-none transition-opacity hover:opacity-80 w-full" 
       :class="sidebarOpen ? 'justify-start' : 'justify-center'">
      <span class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center flex-shrink-0 shadow-lg transition-transform hover:scale-105">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4h3v12h6.5V19H7V4z"/>
        </svg>
      </span>
      <span class="leading-none" :class="sidebarOpen ? 'block' : 'hidden'">
        <span class="text-sm font-extrabold tracking-tight text-base-content block">Lumra</span>
        <span class="text-xs font-bold tracking-widest text-base-content/60 uppercase block mt-0.5">ERP</span>
      </span>
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 overflow-y-auto py-4" role="navigation" aria-label="Main navigation">
    <ul class="menu menu-vertical gap-1 px-2">
      
      <!-- Dashboard -->
      <li>
        <a href="{% url 'dashboard' %}" 
           class="rounded-lg transition-all hover:bg-success/10 focus:bg-success/20 text-base-content/80 hover:text-base-content" 
           :class="currentPage === 'dashboard' ? 'bg-success/20 text-success font-semibold' : ''">
          <i class="fas fa-home w-5 h-5"></i>
          <span :class="sidebarOpen ? 'block' : 'hidden'">Dashboard</span>
        </a>
      </li>

      <!-- Section: Operations -->
      <li :class="sidebarOpen ? 'mt-4' : 'mt-3'">
        <div class="menu-title" :class="sidebarOpen ? 'block' : 'hidden'">
          <span class="text-xs font-bold tracking-widest uppercase text-base-content/40">Operations</span>
        </div>
      </li>
      
      <!-- Sales -->
      <li>
        <a href="#" class="rounded-lg transition-all hover:bg-primary/10">
          <i class="fas fa-shopping-cart w-5 h-5"></i>
          <span :class="sidebarOpen ? 'block' : 'hidden'">Sales</span>
        </a>
      </li>

      <!-- Inventory -->
      <li>
        <a href="#" class="rounded-lg transition-all hover:bg-primary/10">
          <i class="fas fa-boxes w-5 h-5"></i>
          <span :class="sidebarOpen ? 'block' : 'hidden'">Inventory</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<script>
function sidebarApp() {
  return {
    sidebarOpen: true,
    currentPage: 'dashboard',
    
    init() {
      const saved = localStorage.getItem('sidebarOpen');
      this.sidebarOpen = saved !== 'false';
    },
    
    toggle() {
      this.sidebarOpen = !this.sidebarOpen;
      localStorage.setItem('sidebarOpen', this.sidebarOpen.toString());
    }
  }
}
</script>
