{% load static %}
<!--
  LUMRA SIDEBAR — Hybrid v3.0
  Stack: DaisyUI + Tailwind CSS + Alpine.js
-->

<aside class="lumra-sidebar bg-base-100 border-r border-base-300 shadow-lg overflow-hidden flex flex-col" 
       :style="isOpen ? 'width: var(--sidebar-w-open)' : 'width: var(--sidebar-w-closed)'"
       x-data="sidebarApp()"
       x-init="init()"
       x-cloak>
  
  <!-- Logo Header -->
  <div class="flex items-center justify-center p-3 border-b border-base-300 flex-shrink-0">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 text-decoration-none w-full" :class="isOpen ? 'justify-start px-2' : 'justify-center'">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center flex-shrink-0">
        <i class="fas fa-leaf text-white text-sm"></i>
      </div>
      <span :class="isOpen ? 'block' : 'hidden'" class="font-bold text-base-content">Lumra</span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 px-2">
    <ul class="space-y-2">
      <!-- Dashboard -->
      <li>
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all hover:bg-base-200" :class="isActive('dashboard') ? 'bg-primary text-primary-content' : ''">
          <i class="fas fa-home w-5 h-5 flex-shrink-0"></i>
          <span :class="isOpen ? 'block' : 'hidden'" class="truncate">Dashboard</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<script>
function sidebarApp() {
  return {
    isOpen: true,
    
    init() {
      const saved = localStorage.getItem('lumraSidebarOpen');
      this.isOpen = saved !== 'false';
    },
    
    toggle() {
      this.isOpen = !this.isOpen;
      localStorage.setItem('lumraSidebarOpen', this.isOpen.toString());
    },
    
    isActive(page) {
      return window.location.pathname.includes(page);
    }
  }
}
</script>
