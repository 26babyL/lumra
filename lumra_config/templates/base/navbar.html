{% load static %}
<style>
  /* LUMRA NAVBAR — v5.0 Clean Production */
  [x-cloak] { display: none !important; }

  /* Shell */
  .nav {
    background: var(--nav-bg);
    border-bottom: 0.5px solid var(--nav-border);
    height: var(--navbar-height, 60px);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 18px;
    position: relative;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-shadow: var(--nav-shadow);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    transition: box-shadow 0.2s ease, background 0.25s ease;
    flex-shrink: 0;
    will-change: auto;
  }

  @media (min-width: 768px) {
    .nav {
      transition: box-shadow 0.2s ease, background 0.25s ease, margin-left 0.28s cubic-bezier(0.4,0,0.2,1);
    }
  }

  /* Icon Button */
  .nav-btn {
    position: relative;
    width: 34px; height: 34px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted, #6b7280);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary, #1f2937); }

  /* Spacer */
  .nav-spacer { flex: 1; }
</style>

<header class="nav">
  <!-- Toggle Sidebar Button -->
  <button class="nav-btn" @click="dispatch('lumra:toggle-sidebar')" aria-label="Toggle sidebar">
    <i class="fas fa-bars text-lg"></i>
  </button>

  <!-- Search -->
  <div class="flex-1 max-w-md">
    <input type="text" placeholder="Search..." class="input input-bordered input-sm w-full" />
  </div>

  <div class="nav-spacer"></div>

  <!-- Right Section: Notifications & User Menu -->
  <div class="flex items-center gap-3">
    <!-- Notifications -->
    <button class="nav-btn" aria-label="Notifications">
      <i class="fas fa-bell text-lg"></i>
    </button>

    <!-- User Menu -->
    <div class="dropdown dropdown-end">
      <label tabindex="0" class="nav-btn" aria-label="User menu">
        <i class="fas fa-user-circle text-lg"></i>
      </label>
      <ul tabindex="0" class="dropdown-content menu p-2 shadow-lg bg-base-100 rounded-box w-56">
        <li><a href="{% url 'profile' %}">Profile</a></li>
        <li><a href="{% url 'settings' %}">Settings</a></li>
        <li><a href="{% url 'logout' %}" class="text-error">Logout</a></li>
      </ul>
    </div>
  </div>
</header>
