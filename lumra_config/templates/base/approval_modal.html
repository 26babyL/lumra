{% load static %}

{# APPROVAL MODAL — Quick Action #}

<style>[x-cloak]{display:none!important}
  .approval-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }

  .approval-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
  }

  .approval-box {
    position: relative;
    z-index: 1;
    width: min(440px, 94vw);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border: 0.5px solid rgba(0, 103, 79, 0.1);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
    overflow: hidden;
  }
</style>

<div class="approval-overlay" x-show="open" @click="open = false" x-data="{ open: false }" x-cloak>
  <div class="approval-backdrop"></div>
  <div class="approval-box">
    <!-- Modal content here -->
    <div class="p-6">
      <h2 class="text-lg font-bold mb-4">Confirmation</h2>
      <p class="text-sm text-base-content/60 mb-6">Are you sure?</p>
      <div class="flex gap-3 justify-end">
        <button class="btn btn-ghost" @click="open = false">Cancel</button>
        <button class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>
</div>
