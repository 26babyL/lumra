<style>[x-cloak]{display:none!important}</style>
<!-- base/sidebar_item.html -->
<div class="mb-1">
    <a href="{% url url %}" x-ref="{{ ref|default:'' }}"
       :aria-current="isActive('/{{ url }}/') ? 'page' : null"
       class="group relative w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all duration-150"
       style="font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;"
       :class="{
           'justify-center': !isSidebarOpen,
           'bg-success/20 text-success': isActive('/{{ url }}/')
       }">
        <i class="fas {{ icon }} w-6 text-center flex-shrink-0 transition-all group-hover:scale-110"
           :class="isActive('/{{ url }}/') ? 'text-success' : 'text-base-content/60'"></i>
        <span x-show="isSidebarOpen" x-transition class="flex-1 truncate">{{ label }}</span>
    </a>
</div>
