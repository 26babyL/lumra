{% load static %}
<!--
  SIDEBAR RIGHT — Activity Pulse
-->

<style>[x-cloak]{display:none!important}
  @keyframes pulse-ring {
    0%   { transform: scale(1);   opacity: .8; }
    60%  { transform: scale(1.9); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .pulse-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    animation: pulse-ring 2s ease-out infinite;
  }
</style>

<aside class="w-72 bg-base-100 border-l border-base-300 shadow-2xl overflow-hidden flex flex-col hidden xl:flex" x-cloak>
  <!-- Header -->
  <div class="p-4 border-b border-base-300 flex-shrink-0">
    <h2 class="text-lg font-bold text-base-content">Activity</h2>
  </div>

  <!-- Activity Feed -->
  <div class="flex-1 overflow-y-auto p-4">
    <div class="space-y-4">
      <!-- Activity items go here -->
      <p class="text-sm text-base-content/60 text-center py-8">No recent activity</p>
    </div>
  </div>
</aside>
