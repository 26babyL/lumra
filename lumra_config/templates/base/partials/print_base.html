{# base/partials/print_base.html #}
{# Base template for printable documents (invoices, reports, etc) #}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Dokumen LUMRA" }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: white;
            color: #1f2937;
            line-height: 1.6;
        }

        .page {
            width: 210mm;
            height: 297mm;
            margin: 10mm auto;
            padding: 20mm;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20mm;
            padding-bottom: 10px;
            border-bottom: 2px solid #10b981;
        }

        .company-info h1 {
            color: #059669;
            font-size: 24pt;
            margin-bottom: 5px;
        }

        .company-info p {
            color: #6b7280;
            font-size: 9pt;
            margin: 2px 0;
        }

        .doc-title {
            text-align: right;
        }

        .doc-title h2 {
            color: #1f2937;
            font-size: 18pt;
            margin-bottom: 5px;
        }

        .doc-title p {
            color: #6b7280;
            font-size: 9pt;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15mm 0;
        }

        table th {
            background: #ecfdf5;
            color: #059669;
            padding: 10px;
            text-align: left;
            border: 1px solid #d1fae5;
            font-weight: 600;
            font-size: 10pt;
        }

        table td {
            padding: 8px 10px;
            border: 1px solid #e5e7eb;
            font-size: 10pt;
        }

        table tr:nth-child(even) {
            background: #f9fafb;
        }

        .total-section {
            float: right;
            width: 150mm;
            text-align: right;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .total-row.grand-total {
            font-size: 12pt;
            font-weight: bold;
            color: #059669;
            border-bottom: 2px solid #10b981;
            margin-top: 5px;
        }

        .footer {
            margin-top: 20mm;
            text-align: center;
            font-size: 9pt;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
            padding-top: 10mm;
        }

        .clearfix {
            clear: both;
        }

        @media print {
            .page {
                margin: 0;
                box-shadow: none;
            }
            body {
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        {% block print_content %}{% endblock %}

        <div class="footer">
            <p>Dicetak pada {{ now|date:"d/m/Y H:i" }} | LUMRA ERP System</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Auto-print dialog
            setTimeout(() => window.print(), 500);
        };
    </script>
</body>
</html>
