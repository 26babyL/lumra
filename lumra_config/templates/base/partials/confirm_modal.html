{# base/partials/confirm_modal.html - DaisyUI Version #}
# Reusable confirmation dialog modal

<div x-show="confirmModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" style="display:none;">
  <div class="modal-box bg-base-100 rounded-lg shadow-2xl border border-base-300 max-w-md w-full mx-4 overflow-hidden">
    <!-- Header -->
    <div class="bg-base-200 px-6 py-4 border-b border-base-300">
      <h3 class="text-lg font-bold text-base-content flex items-center gap-2">
        <i class="fas fa-exclamation-triangle text-warning"></i>
        {{ modal_title }}
      </h3>
    </div>

    <!-- Body -->
    <div class="px-6 py-4">
      <p class="text-base-content">
        {{ modal_message }}
      </p>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-base-200 border-t border-base-300 flex gap-3 justify-end">
      <button @click="confirmModal = false" class="btn btn-ghost">Batal</button>
      <button @click="onConfirm(); confirmModal = false;" class="btn btn-primary">Konfirmasi</button>
    </div>
  </div>
</div>
