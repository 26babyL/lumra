{% load static %}

{# ACTIVITY DRAWER — Slide-Over #}

<style>[x-cloak]{display:none!important}
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    z-index: 40;
    transition: opacity .25s ease;
  }

  .drawer-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(460px, 92vw);
    z-index: 41;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-left: 0.5px solid rgba(0, 103, 79, 0.08);
    box-shadow: -4px 0 20px rgba(0,0,0,.08);
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4, 0, .2, 1);
  }
  .drawer-panel.open {
    transform: translateX(0);
  }
</style>

<div class="drawer-backdrop" x-show="open" @click="open = false"></div>

<div class="drawer-panel" :class="open ? 'open' : ''" x-data="{ open: false }">
  <!-- Content here -->
  <div class="p-6">
    <h2 class="text-lg font-bold">Activity</h2>
  </div>
</div>
