{% load static %}
<!--
  LUMRA NAVBAR — Hybrid v2.0
  Stack: DaisyUI + Tailwind CSS + Alpine.js
-->

<style>
  :root {
    --jade-glow: rgba(0,168,107,0.28);
  }
  [x-cloak] { display: none !important; }
  
  .lumra-nav {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    transition: box-shadow .2s ease, background .25s ease;
  }
</style>

<header class="lumra-nav navbar bg-base-100 border-b border-base-300 shadow-sm">
  <!-- Left: Sidebar Toggle -->
  <div class="flex-none">
    <button class="btn btn-ghost btn-circle" @click="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fas fa-bars text-lg"></i>
    </button>
  </div>

  <!-- Center: Search -->
  <div class="flex-1 px-4">
    <input type="text" placeholder="Search..." class="input input-bordered input-sm w-full max-w-xs" />
  </div>

  <!-- Right: Notifications & User Menu -->
  <div class="flex-none gap-3">
    <!-- Notifications -->
    <div class="dropdown dropdown-end">
      <label tabindex="0" class="btn btn-ghost btn-circle" aria-label="Notifications">
        <div class="indicator">
          <i class="fas fa-bell text-lg"></i>
          <span class="badge badge-xs badge-primary indicator-item">3</span>
        </div>
      </label>
      <ul tabindex="0" class="dropdown-content menu p-2 shadow-lg bg-base-100 rounded-box w-80">
        <li class="menu-title"><span>Notifications</span></li>
        <li><a>New order received</a></li>
        <li><a>Low stock alert</a></li>
        <li><a>System update</a></li>
      </ul>
    </div>

    <!-- User Menu -->
    <div class="dropdown dropdown-end">
      <label tabindex="0" class="btn btn-ghost btn-circle avatar" aria-label="User menu">
        <div class="w-10 rounded-full">
          <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.jpg" alt="User" />
        </div>
      </label>
      <ul tabindex="0" class="dropdown-content menu p-2 shadow-lg bg-base-100 rounded-box w-56">
        <li class="menu-title"><span>{{ user.get_full_name|default:user.username }}</span></li>
        <li><a href="{% url 'profile' %}">Profile</a></li>
        <li><a href="{% url 'settings' %}">Settings</a></li>
        <li><a href="{% url 'logout' %}" class="text-error">Logout</a></li>
      </ul>
    </div>
  </div>
</header>
