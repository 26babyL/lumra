{% load static %}
<!--
  LUMRA NAVBAR — Hybrid v2.0
  ─────────────────────────────────────────────
  Stack    : DaisyUI + Tailwind CSS + Alpine.js
  Role     : Navigation hub + search center + notifications + settings
  
  SIDEBAR TOGGLE:
  • Button dispatch 'lumra:toggle-sidebar' event
  • Parent lumraShell handle toggle + persist state + broadcast update
  • navbar listen 'lumra:sidebar-changed' untuk future UI reactions
  
  SEARCH:
  • Smart search dengan prefix commands (P: L: S:)
  • Keyboard nav (↑↓ Enter Esc) + shortcuts (/ Ctrl+K)
  • Recent searches + loading state
  
  FEATURES:
  • Notification tabs (Semua / Stok / Alert / Laporan)
  • Store switcher w/ status dot + CSRF-safe API call
  • Dark / Light theme toggle
  • Full a11y: aria-*, focus-visible, role=combobox
  ─────────────────────────────────────────────
-->

<style>
  /* ── Custom tokens (supplement DaisyUI) ── */
  /* :root tokens (--jade, etc.) dideklarasikan di base_hybrid.html */
  :root {
    --jade-glow:  rgba(0,168,107,0.28);
    --danger-glow:rgba(239,68,68,0.28);
  }

  /* ── [x-cloak] ── */
  [x-cloak] { display: none !important; }

  /* ── Backdrop blur for the bar itself ── */
  .lumra-nav {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    transition: box-shadow .2s ease, background .25s ease;
  }

  /* ── Store status dot ── */
  .store-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .store-dot.online,
  .store-dot.live   { background: var(--jade); animation: dotPulse 2.6s ease infinite; }
  .store-dot.warning,
  .store-dot.busy   { background: #f59e0b; }
  .store-dot.offline{ background: oklch(var(--bc)/.3); }

  @keyframes dotPulse {
    0%,100% { box-shadow: 0 0 0 0 var(--jade-glow); }
    50%      { box-shadow: 0 0 0 4px rgba(0,168,107,0); }
  }

  /* ── Notification unread dot ── */
  @keyframes notifPulse {
    0%,100% { box-shadow: 0 0 0 0 var(--danger-glow); }
    50%      { box-shadow: 0 0 0 4px rgba(239,68,68,0); }
  }
  .notif-pulse { animation: notifPulse 2.6s ease infinite; }

  /* ── Search highlight active kb row ── */
  .kb-active { background: oklch(var(--b2)) !important; position:relative; }
  .kb-active::before {
    content: '';
    position: absolute; left: 0; top: 15%; bottom: 15%;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--jade);
  }

  /* ── Token badges ── */
  .tok-product  { background: rgba(0,168,107,.10); color: #065f46; }
  .tok-location { background: rgba(59,130,246,.10); color: #1e40af; }
  .tok-stock    { background: rgba(245,158,11,.10); color: #78350f; }
  :is(.dark, [data-theme="dark"]) .tok-product  { background: rgba(0,168,107,.18); color: #34d399; }
  :is(.dark, [data-theme="dark"]) .tok-location { background: rgba(59,130,246,.18); color: #60a5fa; }
  :is(.dark, [data-theme="dark"]) .tok-stock    { background: rgba(245,158,11,.18); color: #fbbf24; }

  /* ── Result type icons ── */
  .rti-product  { background: rgba(0,168,107,.10); color: #065f46; }
  .rti-location { background: rgba(59,130,246,.10); color: #1e40af; }
  .rti-stock    { background: rgba(245,158,11,.10); color: #78350f; }
  :is(.dark, [data-theme="dark"]) .rti-product  { background: rgba(0,168,107,.18); color: #34d399; }
  :is(.dark, [data-theme="dark"]) .rti-location { background: rgba(59,130,246,.18); color: #60a5fa; }
  :is(.dark, [data-theme="dark"]) .rti-stock    { background: rgba(245,158,11,.18); color: #fbbf24; }

  /* ── Badge pills ── */
  .bp-success { background: rgba(0,168,107,.10); color: #065f46; }
  .bp-warning { background: rgba(245,158,11,.10); color: #78350f; }
  .bp-danger  { background: rgba(239,68,68,.10);  color: #991b1b; }
  .bp-neutral { background: oklch(var(--b2)); color: oklch(var(--bc)/.6); border: .5px solid oklch(var(--bc)/.15); }
  :is(.dark, [data-theme="dark"]) .bp-success { background: rgba(0,168,107,.18); color: #34d399; }
  :is(.dark, [data-theme="dark"]) .bp-warning { background: rgba(245,158,11,.18); color: #fbbf24; }
  :is(.dark, [data-theme="dark"]) .bp-danger  { background: rgba(239,68,68,.18);  color: #f87171; }

  /* ── Notif type badges ── */
  .ntb-stock  { background: rgba(245,158,11,.10); color: #78350f; }
  .ntb-system { background: rgba(59,130,246,.10);  color: #1e40af; }
  .ntb-report { background: rgba(0,168,107,.10);   color: #065f46; }
  .ntb-alert  { background: rgba(239,68,68,.10);   color: #991b1b; }
  :is(.dark, [data-theme="dark"]) .ntb-stock  { background: rgba(245,158,11,.18); color: #fbbf24; }
  :is(.dark, [data-theme="dark"]) .ntb-system { background: rgba(59,130,246,.18); color: #60a5fa; }
  :is(.dark, [data-theme="dark"]) .ntb-report { background: rgba(0,168,107,.18);  color: #34d399; }
  :is(.dark, [data-theme="dark"]) .ntb-alert  { background: rgba(239,68,68,.18);  color: #f87171; }

  /* ── Smooth dropdown ── */
  .dd-enter-start { opacity:0; transform:scale(.96) translateY(-6px); }
  .dd-enter-end   { opacity:1; transform:scale(1) translateY(0); }
  .dd-leave-end   { opacity:0; transform:scale(.96) translateY(-6px); }

  /* ── Thin scrollbar ── */
  .thin-scroll::-webkit-scrollbar { width: 3px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: oklch(var(--bc)/.2); border-radius: 10px; }

  /* ── kbd chip ── */
  .kbd-chip {
    display: inline-flex; align-items: center;
    padding: 1px 5px;
    border: .5px solid oklch(var(--bc)/.15);
    border-radius: 5px;
    background: oklch(var(--b2));
    font-size: 10px; font-weight: 600;
    font-family: ui-monospace, 'SF Mono', monospace;
    color: oklch(var(--bc)/.5);
    line-height: 1.6;
  }

  /* ── Search token overlay ── */
  .search-token-overlay {
    position: absolute;
    left: 2.3rem; top: 50%;
    transform: translateY(-50%);
    z-index: 5; pointer-events: none;
  }

  /* ── Animate spin ── */
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Avatar ring on hover ── */
  .avatar-btn:hover .avatar-ring {
    border-color: var(--jade);
    box-shadow: 0 0 0 2px var(--jade-light);
  }

  /* ── Mobile: hide city in store pill ── */
  @media (max-width: 640px) {
    .store-pill-city { display: none; }
    .nav-search-wrap { padding: 0 6px; }
  }
</style>

<header
  class="lumra-nav navbar bg-base-200 border-b border-base-300 shadow-sm h-[60px] min-h-[60px] px-3 gap-0 font-['Plus_Jakarta_Sans',system-ui] flex-shrink-0"
  x-data="navApp()"
  x-init="init()"
  x-cloak>

  <!-- ░░ LEFT ░░ -->
  <div class="flex items-center gap-2 flex-shrink-0">

    <!-- Brand — Icon only -->
    <a href="{% url 'dashboard' %}"
       class="flex items-center justify-center w-9 h-9 flex-shrink-0 opacity-100 hover:opacity-80 transition-opacity"
       aria-label="Lumra — dasbor">
      <span class="w-7 h-7 rounded-[8px] bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-700 flex items-center justify-center flex-shrink-0 shadow-sm hover:scale-105 transition-transform" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M7 4h3v12h6.5V19H7V4z"/></svg>
      </span>
    </a>

    <div class="w-px h-[18px] bg-base-300 mx-0.5 flex-shrink-0"></div>

    <!-- Store Pill -->
    <div class="relative flex-shrink-0" @click.outside="storeOpen = false">
      <button
        class="flex items-center gap-1.5 h-[34px] px-2.5 border border-base-300 rounded-[9px] bg-base-100 text-[12.5px] font-semibold text-base-content cursor-pointer transition-all hover:border-success/30 hover:bg-base-200 outline-none focus-visible:ring-2 focus-visible:ring-[var(--jade-ring)] whitespace-nowrap max-w-[200px]"
        @click="storeOpen = !storeOpen"
        :aria-expanded="storeOpen"
        aria-haspopup="listbox"
        aria-label="Ganti cabang">
        <span class="store-dot" :class="activeStore.status || 'online'"></span>
        <span class="overflow-hidden text-ellipsis flex-1 min-w-0" x-text="activeStore.name"></span>
        <span class="store-pill-city text-[11px] text-base-content/50 font-medium" x-show="activeStore.city">
          <span class="text-base-content/30 mx-0.5">·</span>
          <span x-text="activeStore.city"></span>
        </span>
        <svg class="w-3 h-3 text-base-content/40 flex-shrink-0 transition-transform duration-200"
             :class="storeOpen ? 'rotate-180' : ''"
             fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <!-- Store Dropdown -->
      <div
        x-show="storeOpen"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
        class="absolute top-full left-0 mt-2 w-56 bg-base-100 border border-base-300 rounded-[14px] shadow-xl z-[200] overflow-hidden"
        role="listbox"
        :aria-label="'Pilih cabang, aktif: ' + activeStore.name">

        <div class="max-h-60 overflow-y-auto thin-scroll py-1">
          <template x-for="store in stores" :key="store.id">
            <button
              class="w-full flex items-center gap-2.5 px-3 py-2 text-left border-l-[2.5px] transition-colors outline-none focus-visible:bg-base-200"
              :class="store.id === activeStore.id
                ? 'bg-success/5 border-l-[var(--jade)]'
                : 'border-l-transparent hover:bg-base-200'"
              @click="switchStore(store, $event)"
              role="option"
              :aria-selected="store.id === activeStore.id">
              <span class="text-sm" x-text="store.emoji || '🏪'" aria-hidden="true"></span>
              <div class="flex-1 min-w-0">
                <p class="text-[12.5px] font-semibold text-base-content whitespace-nowrap overflow-hidden text-ellipsis m-0" x-text="store.name"></p>
                <p class="text-[11px] text-base-content/50 m-0" x-text="store.city || ''"></p>
              </div>
              <svg class="w-3.5 h-3.5 text-[var(--jade)] flex-shrink-0 transition-opacity"
                   :class="store.id === activeStore.id ? 'opacity-100' : 'opacity-0'"
                   fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </button>
          </template>
        </div>

        <div class="border-t border-base-300 px-3 py-2.5">
          <a href="{% url 'locations' %}" class="text-[12px] font-semibold text-[var(--jade)] no-underline hover:opacity-70 transition-opacity">
            Kelola Cabang →
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ░░ CENTER — Smart Search ░░ -->
  <div class="flex-1 flex justify-center px-3 min-w-0 nav-search-wrap" @click.outside="closeSearch()">
    <div class="relative w-full max-w-[520px]">

      <!-- Left icon -->
      <span class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-base-content/40 flex items-center transition-colors"
            :style="searchFocused ? 'color:var(--jade)' : ''">
        <svg class="w-[15px] h-[15px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </span>

      <!-- Command prefix token -->
      <div class="search-token-overlay" x-show="parsedCmd.prefix" x-ref="tokenWrap">
        <span class="inline-flex items-center px-1.5 py-0.5 rounded-[5px] text-[10px] font-bold tracking-[.05em] uppercase"
              :class="'tok-'+parsedCmd.type"
              x-ref="tokenEl"
              x-text="parsedCmd.label"></span>
      </div>

      <!-- Input -->
      <input
        id="nav-search"
        type="text"
        x-model="query"
        :placeholder="searchFocused ? '' : placeholders[hintIdx]"
        @focus="onSearchFocus()"
        @blur="searchFocused = false"
        @input="onInput()"
        @keydown.escape.prevent="closeSearch()"
        @keydown.arrow-down.prevent="kbMove(1)"
        @keydown.arrow-up.prevent="kbMove(-1)"
        @keydown.enter.prevent="onEnter()"
        autocomplete="off"
        spellcheck="false"
        class="w-full h-[34px] rounded-[9px] bg-base-200 border border-base-300 text-[13px] font-medium text-base-content placeholder:text-base-content/30 outline-none transition-all focus:bg-base-100 focus:border-success/40 focus:ring-2 focus:ring-[var(--jade-light)] caret-[var(--jade)] pr-10"
        :style="parsedCmd.prefix && tokenW > 0
          ? 'padding-left:calc(2.1rem + ' + tokenW + 'px + 8px)'
          : 'padding-left:2.1rem'"
        aria-label="Cari produk, lokasi, atau stok"
        role="combobox"
        :aria-expanded="showDropdown && (results.length > 0 || !query)"
        aria-controls="search-listbox"
        aria-autocomplete="list">

      <!-- Right slot -->
      <div class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center gap-1">
        <button
          x-show="query.length > 0"
          @click="clearSearch()"
          class="w-5 h-5 rounded-[5px] flex items-center justify-center text-base-content/40 hover:text-base-content hover:bg-base-300 transition-colors outline-none"
          aria-label="Hapus pencarian">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
        <span x-show="!query && !searchFocused" class="kbd-chip" aria-hidden="true">/</span>
        <span x-show="!query && searchFocused"  class="kbd-chip" style="font-size:9px;" aria-hidden="true">ESC</span>
      </div>

      <!-- Search Dropdown -->
      <div
        x-show="showDropdown"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
        class="absolute top-full left-0 right-0 mt-1.5 bg-base-100 border border-base-300 rounded-[14px] shadow-xl z-[200] overflow-hidden"
        id="search-listbox"
        role="listbox">

        <!-- Idle: hints + recent -->
        <template x-if="!query && searchFocused">
          <div>
            <p class="text-[10px] font-bold tracking-[.08em] uppercase text-base-content/30 px-3.5 pt-3 pb-1.5">Shortcut Pencarian</p>
            <div class="px-1.5 pb-2">
              <template x-for="h in cmdHints" :key="h.prefix">
                <button
                  class="w-full flex items-center gap-2.5 px-3 py-2 rounded-[8px] hover:bg-base-200 transition-colors text-left outline-none"
                  @click="setQuery(h.prefix + ' ')">
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded-[5px] text-[10px] font-bold tracking-[.05em] uppercase"
                        :class="'tok-'+h.type"
                        x-text="h.label"></span>
                  <span class="text-[12px] text-base-content/60 flex-1 text-left" x-text="h.desc"></span>
                  <span class="kbd-chip text-[9px]" x-text="h.prefix"></span>
                </button>
              </template>
            </div>

            <template x-if="recent.length > 0">
              <div>
                <p class="text-[10px] font-bold tracking-[.08em] uppercase text-base-content/30 px-3.5 pt-2 pb-1.5 border-t border-base-300">Terakhir Dicari</p>
                <template x-for="r in recent" :key="r">
                  <button class="w-full flex items-center gap-2 px-3.5 py-1.5 hover:bg-base-200 transition-colors text-left outline-none" @click="setQuery(r)">
                    <svg class="w-3 h-3 text-base-content/25 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-[12.5px] text-base-content/70" x-text="r"></span>
                  </button>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Loading -->
        <template x-if="loading && query">
          <div class="flex items-center gap-3 px-4 py-4">
            <svg class="w-4 h-4 text-[var(--jade)] spin" fill="none" viewBox="0 0 24 24">
              <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <span class="text-[13px] text-base-content/50">Mencari…</span>
          </div>
        </template>

        <!-- Results -->
        <template x-if="!loading && results.length > 0 && query">
          <div>
            <p class="text-[10px] font-bold tracking-[.08em] uppercase text-base-content/30 px-3.5 pt-3 pb-1" x-text="resultsLabel"></p>
            <div class="max-h-64 overflow-y-auto thin-scroll pb-1">
              <template x-for="(item, idx) in results" :key="item.id">
                <button
                  class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-left transition-colors outline-none relative"
                  :class="idx === kbIdx ? 'kb-active' : 'hover:bg-base-200'"
                  @click="selectResult(item)"
                  role="option"
                  :aria-selected="idx === kbIdx">
                  <div class="w-7 h-7 rounded-[8px] flex items-center justify-center text-[10px] font-bold flex-shrink-0"
                       :class="'rti-'+item.type"
                       x-text="item.type==='product'?'P':item.type==='location'?'L':'S'"
                       aria-hidden="true"></div>
                  <div class="flex-1 min-w-0 text-left">
                    <p class="text-[13px] font-medium text-base-content m-0 overflow-hidden text-ellipsis whitespace-nowrap" x-text="item.name"></p>
                    <p class="text-[11px] text-base-content/50 m-0" x-text="item.subtitle"></p>
                  </div>
                  <span x-show="item.badge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full flex-shrink-0"
                        :class="item.badgeClass" x-text="item.badge"></span>
                </button>
              </template>
            </div>
            <div class="border-t border-base-300 px-3.5 py-2 flex justify-between items-center">
              <span class="text-[11px] text-base-content/40" x-text="results.length + ' hasil'"></span>
              <span class="text-[11px] text-base-content/40 flex items-center gap-1">
                <span class="kbd-chip">↵</span> lihat semua
              </span>
            </div>
          </div>
        </template>

        <!-- Empty -->
        <template x-if="!loading && results.length === 0 && query.length > 1">
          <div class="py-8 px-4 text-center">
            <svg class="w-6 h-6 text-base-content/20 mx-auto mb-2.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <p class="text-[13px] font-medium text-base-content/60 m-0 mb-1">
              Tidak ada hasil untuk "<span class="text-base-content" x-text="parsedCmd.term || query"></span>"
            </p>
            <p x-show="!parsedCmd.prefix" class="text-[11px] text-base-content/30 m-0 flex items-center justify-center gap-1">
              Coba prefix:
              <span class="kbd-chip text-[9px]">P:</span>
              <span class="kbd-chip text-[9px]">L:</span>
              <span class="kbd-chip text-[9px]">S:</span>
            </p>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ░░ RIGHT ░░ -->
  <div class="flex items-center gap-1 flex-shrink-0 ml-auto">

    <!-- Notifications -->
    <div class="relative" @click.outside="notifOpen = false">
      <button
        class="btn btn-ghost btn-sm w-[34px] h-[34px] p-0 rounded-[9px] text-base-content/50 hover:text-base-content hover:bg-base-200 active:scale-90 transition-all outline-none focus-visible:ring-2 focus-visible:ring-[var(--jade-ring)] relative"
        @click="notifOpen = !notifOpen"
        :aria-expanded="notifOpen"
        aria-haspopup="true"
        aria-label="Notifikasi">
        <svg class="w-[17px] h-[17px] stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 00-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span
          x-show="notifCount > 0"
          class="absolute top-1.5 right-1.5 w-[7px] h-[7px] rounded-full bg-error border-2 border-base-100 notif-pulse"
          aria-label="Ada notifikasi belum dibaca"></span>
      </button>

      <!-- Notification Dropdown -->
      <div
        x-show="notifOpen"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
        class="absolute top-full right-0 mt-2 w-80 bg-base-100 border border-base-300 rounded-[14px] shadow-xl z-[200] overflow-hidden">

        <!-- Header with tabs -->
        <div class="flex items-center justify-between px-4 pt-3 pb-0 border-b border-base-300">
          <span class="text-[13px] font-bold text-base-content">Notifikasi</span>
          <div class="flex gap-0.5" role="tablist">
            <template x-for="tab in notifTabs" :key="tab.key">
              <button
                class="px-2.5 py-1.5 text-[11px] font-semibold border-b-2 transition-colors outline-none mb-[-0.5px] focus-visible:rounded-sm focus-visible:ring-2 focus-visible:ring-[var(--jade-ring)]"
                :class="activeNotifTab === tab.key
                  ? 'text-[var(--jade)] border-[var(--jade)]'
                  : 'text-base-content/40 border-transparent hover:text-base-content/70'"
                @click="activeNotifTab = tab.key"
                role="tab"
                :aria-selected="activeNotifTab === tab.key"
                x-text="tab.label"></button>
            </template>
          </div>
        </div>

        <div class="max-h-72 overflow-y-auto thin-scroll" role="tabpanel">
          <template x-for="n in filteredNotifs" :key="n.id">
            <a :href="n.url || '#'"
               class="flex items-start gap-2.5 px-4 py-3 hover:bg-base-200 transition-colors cursor-pointer no-underline relative"
               :class="n.read ? '' : 'bg-success/[.018]'">
              <div class="w-8 h-8 rounded-[8px] bg-base-200 border border-base-300 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-base-content/50" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" :d="notifIconPath(n.type)"/>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                  <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-[4px] tracking-[.04em] uppercase"
                        :class="'ntb-'+n.type"
                        x-text="notifLabel(n.type)"></span>
                  <span class="text-[10px] text-base-content/30" x-text="n.time"></span>
                </div>
                <p class="text-[12px] text-base-content leading-snug m-0" x-text="n.message"></p>
              </div>
              <span x-show="!n.read"
                    class="absolute top-1/2 right-3 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-[var(--jade)]"
                    aria-hidden="true"></span>
            </a>
          </template>

          <template x-if="filteredNotifs.length === 0">
            <div class="py-8 text-center">
              <svg class="w-6 h-6 text-base-content/20 mx-auto mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 00-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <p class="text-[12px] text-base-content/40 m-0">Tidak ada notifikasi</p>
            </div>
          </template>
        </div>

        <div class="border-t border-base-300 px-4 py-2.5">
          <a href="{% url 'notifications' %}" class="text-[12px] font-semibold text-[var(--jade)] no-underline hover:opacity-70 transition-opacity">
            Lihat semua →
          </a>
        </div>
      </div>
    </div>

    <div class="w-px h-[18px] bg-base-300 mx-0.5 flex-shrink-0"></div>

    <!-- Profile -->
    <div class="relative" @click.outside="profileOpen = false">
      <button
        class="avatar-btn flex items-center gap-2 px-2 py-1 rounded-[10px] transition-all hover:bg-base-200 outline-none focus-visible:ring-2 focus-visible:ring-[var(--jade-ring)] border border-transparent"
        @click="profileOpen = !profileOpen"
        :aria-expanded="profileOpen"
        aria-haspopup="true">
        <img
          class="avatar-ring w-7 h-7 rounded-full object-cover border-[1.5px] border-base-300 transition-all flex-shrink-0"
          src="{{ user.profile.avatar.url|default:'/static/img/default-avatar.png' }}"
          alt="{{ user.get_full_name|default:user.username }}"
          loading="lazy"
          onerror="this.src='/static/img/default-avatar.png'">
        <div class="hidden md:block text-left leading-none">
          <p class="text-[12.5px] font-semibold text-base-content m-0 whitespace-nowrap">{{ user.get_full_name|default:user.username }}</p>
          <p class="text-[10px] text-base-content/50 m-0 mt-0.5 whitespace-nowrap">{{ user.profile.role|default:"User" }}</p>
        </div>
        <svg class="hidden md:block w-[11px] h-[11px] text-base-content/30 transition-transform duration-200"
             :class="profileOpen ? 'rotate-180' : ''"
             fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <!-- Profile Dropdown -->
      <div
        x-show="profileOpen"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
        class="absolute top-full right-0 mt-2 w-52 bg-base-100 border border-base-300 rounded-[14px] shadow-xl z-[200] overflow-hidden">

        <!-- Profile header -->
        <div class="px-4 py-3 border-b border-base-300 bg-base-200/50">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="store-dot" :class="activeStore.status || 'online'" style="width:6px;height:6px;animation:none;"></span>
            <span class="text-[12px] font-semibold text-base-content" x-text="activeStore.name"></span>
          </div>
          <p class="text-[11px] text-base-content/50 m-0">{{ user.email }}</p>
        </div>

        <!-- Menu items -->
        <div class="py-1">
          <a href="{% url 'profile' %}"
             class="flex items-center gap-2.5 px-4 py-2.5 text-[12.5px] text-base-content/70 hover:text-base-content hover:bg-base-200 transition-colors no-underline outline-none focus-visible:bg-base-200">
            <svg class="w-4 h-4 text-base-content/40" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Profil Saya
          </a>
          <a href="{% url 'settings' %}"
             class="flex items-center gap-2.5 px-4 py-2.5 text-[12.5px] text-base-content/70 hover:text-base-content hover:bg-base-200 transition-colors no-underline outline-none focus-visible:bg-base-200">
            <svg class="w-4 h-4 text-base-content/40" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Pengaturan
          </a>

          <!-- Theme Toggle -->
          <button
            @click="toggleTheme()"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-[12.5px] text-base-content/70 hover:text-base-content hover:bg-base-200 transition-colors outline-none focus-visible:bg-base-200 text-left">
            <template x-if="theme === 'light'">
              <svg class="w-4 h-4 text-base-content/40" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </template>
            <template x-if="theme === 'dark'">
              <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
              </svg>
            </template>
            <span x-text="theme === 'dark' ? 'Mode Terang' : 'Mode Gelap'"></span>
          </button>
        </div>

        <div class="border-t border-base-300 py-1">
          <a href="{% url 'logout' %}"
             class="flex items-center gap-2.5 px-4 py-2.5 text-[12.5px] text-error hover:bg-error/5 transition-colors no-underline outline-none focus-visible:bg-error/5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Keluar
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
function navApp() {
  return {

    /* ══ STATE ══ */
    theme:         localStorage.getItem('lumra_theme') || 'light',
    storeOpen:     false,
    notifOpen:     false,
    profileOpen:   false,
    searchFocused: false,
    showDropdown:  false,
    query:         '',
    results:       [],
    kbIdx:         -1,
    loading:       false,
    tokenW:        0,
    _debounce:     null,
    _hintTimer:    null,

    placeholders: [
      'Cari produk, lokasi, stok…',
      'Ketik P: untuk cari produk…',
      'Ketik L: untuk cari lokasi…',
      'Ketik S: untuk cek stok…',
    ],
    hintIdx: 0,

    recent: (() => {
      try { return JSON.parse(localStorage.getItem('lumra_recent') || '[]').slice(0, 5); }
      catch { return []; }
    })(),

    cmdHints: [
      { prefix: 'P:', type: 'product',  label: 'Produk', desc: 'Cari nama produk atau SKU' },
      { prefix: 'L:', type: 'location', label: 'Lokasi', desc: 'Filter cabang atau kota'   },
      { prefix: 'S:', type: 'stock',    label: 'Stok',   desc: 'Lihat produk stok rendah'  },
    ],

    notifTabs: [
      { key: 'all',    label: 'Semua'   },
      { key: 'stock',  label: 'Stok'    },
      { key: 'alert',  label: 'Alert'   },
      { key: 'report', label: 'Laporan' },
    ],
    activeNotifTab: 'all',
    notifCount: {{ notifications_count|default:0 }},

    notifications: [
      { id: 1, type: 'stock',  message: 'Kopi Mandheling stok di bawah batas minimum (12 Kg)', time: '5 mnt',  read: false, url: '/products/2/' },
      { id: 2, type: 'alert',  message: 'Gayo Natural Process habis di Toko Utama',             time: '23 mnt', read: false, url: '/products/3/' },
      { id: 3, type: 'report', message: 'Laporan penjualan harian sudah siap',                  time: '1 jam',  read: true,  url: '/reports/sales/' },
      { id: 4, type: 'system', message: 'Sinkronisasi data selesai — semua cabang terhubung',   time: '2 jam',  read: true,  url: '#' },
      { id: 5, type: 'stock',  message: 'Kopi Luwak Toraja mendekati batas kritis (5 Kg)',      time: '3 jam',  read: true,  url: '/products/5/' },
    ],

    activeStore: {{ active_store|default:'{"id":1,"name":"Toko Utama","city":"Jakarta","status":"online","emoji":"🏪"}'|safe }},
    stores:      {{ stores_json|default:'[{"id":1,"name":"Toko Utama","city":"Jakarta","status":"live","emoji":"🏪"},{"id":2,"name":"Cabang Bandung","city":"Bandung","status":"busy","emoji":"🏬"},{"id":3,"name":"Cabang Surabaya","city":"Surabaya","status":"offline","emoji":"🏪"}]'|safe }},

    /* ══ COMPUTED ══ */
    get parsedCmd() {
      const q   = this.query.trim();
      const map = { 'P:': ['product','Produk'], 'L:': ['location','Lokasi'], 'S:': ['stock','Stok'] };
      for (const [pfx, [type, label]] of Object.entries(map)) {
        if (q.toUpperCase().startsWith(pfx)) {
          return { prefix: true, type, label, term: q.slice(2).trim() };
        }
      }
      return { prefix: false, type: null, label: null, term: q };
    },

    get resultsLabel() {
      return { product: 'Produk', location: 'Lokasi', stock: 'Stok Rendah' }[this.parsedCmd.type] || 'Hasil';
    },

    get filteredNotifs() {
      return this.activeNotifTab === 'all'
        ? this.notifications
        : this.notifications.filter(n => n.type === this.activeNotifTab);
    },

    /* ══ LIFECYCLE ══ */
    init() {
      // Apply saved theme
      this._applyTheme(this.theme);

      // Rotate placeholder hints
      this._hintTimer = setInterval(() => {
        this.hintIdx = (this.hintIdx + 1) % this.placeholders.length;
      }, 3500);

      // Measure token width reactively
      this.$watch('parsedCmd', () => {
        this.$nextTick(() => {
          this.tokenW = this.$refs.tokenEl ? this.$refs.tokenEl.offsetWidth : 0;
        });
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', e => {
        // / to focus search
        if (e.key === '/' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
          e.preventDefault();
          this.focusSearch();
        }
        // Ctrl+K / Cmd+K to focus search
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          this.focusSearch();
        }
        // Ctrl+B / Cmd+B to toggle sidebar
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          this.toggleSidebar();
        }
      });

      // Listen untuk perubahan store dari luar
      window.addEventListener('lumra:store-changed', e => {
        if (e.detail?.store) this.activeStore = e.detail.store;
      });

      // Listen untuk perubahan sidebar (untuk UI reaction jika perlu)
      window.addEventListener('lumra:sidebar-changed', e => {
        // navbar bisa react terhadap sidebar changes jika diperlukan
        // currently: no action needed, tapi hook ini tersedia untuk future use
      });
    },

    /* ══ SIDEBAR ══ */
    toggleSidebar() {
      // Dispatch to parent lumraShell which controls everything
      window.dispatchEvent(new CustomEvent('lumra:toggle-sidebar', { 
        bubbles: true, 
        composed: true 
      }));
    },

    /* ══ SEARCH ══ */
    focusSearch() {
      const el = document.getElementById('nav-search');
      if (el) { el.focus(); el.select(); }
    },

    onSearchFocus() {
      this.searchFocused = true;
      this.showDropdown  = true;
    },

    closeSearch() {
      this.searchFocused = false;
      this.showDropdown  = false;
      this.kbIdx = -1;
    },

    clearSearch() {
      this.query   = '';
      this.results = [];
      this.kbIdx   = -1;
      this.tokenW  = 0;
      this.$nextTick(() => document.getElementById('nav-search')?.focus());
    },

    setQuery(val) {
      this.query = val;
      this.$nextTick(() => {
        const el = document.getElementById('nav-search');
        if (el) { el.focus(); el.setSelectionRange(val.length, val.length); }
      });
      this.onInput();
    },

    onInput() {
      this.showDropdown = true;
      this.kbIdx = -1;
      clearTimeout(this._debounce);
      const term = this.parsedCmd.term;
      if (!term) { this.results = []; this.loading = false; return; }
      this.loading  = true;
      this._debounce = setTimeout(() => this._runSearch(), 260);
    },

    async _runSearch() {
      const { term, type } = this.parsedCmd;
      if (!term) { this.loading = false; return; }

      // ─── Replace with real fetch to your Django API ───
      // const res  = await fetch(`/api/search/?q=${encodeURIComponent(term)}&type=${type || ''}`);
      // const data = await res.json();
      // this.results = data.results;
      // ─────────────────────────────────────────────────

      await new Promise(r => setTimeout(r, 160)); // remove with real API
      const mock = {
        product: [
          { id:1, name:'Kopi Gayo Arabica',   subtitle:'SKU: KGA-001 · Stok: 240 Kg', badge:'Tersedia', badgeClass:'bp-success', type:'product', url:'/products/1/' },
          { id:2, name:'Kopi Mandheling',      subtitle:'SKU: KMN-004 · Stok: 12 Kg',  badge:'Terbatas', badgeClass:'bp-warning', type:'product', url:'/products/2/' },
          { id:3, name:'Gayo Natural Process', subtitle:'SKU: GNP-007 · Stok: 0',      badge:'Habis',    badgeClass:'bp-danger',  type:'product', url:'/products/3/' },
          { id:4, name:'Kopi Toraja Kalosi',   subtitle:'SKU: KTR-002 · Stok: 88 Kg',  badge:'Tersedia', badgeClass:'bp-success', type:'product', url:'/products/4/' },
        ],
        location: [
          { id:10, name:'Jakarta Pusat', subtitle:'12 cabang aktif', badge:'12 Cabang', badgeClass:'bp-neutral', type:'location', url:'/locations/jkt/' },
          { id:11, name:'Bandung',       subtitle:'4 cabang aktif',  badge:'4 Cabang',  badgeClass:'bp-neutral', type:'location', url:'/locations/bdg/' },
        ],
        stock: [
          { id:20, name:'Kopi Mandheling',      subtitle:'Stok 12 Kg — di bawah threshold', badge:'< 20 Kg', badgeClass:'bp-warning', type:'stock', url:'/products/2/' },
          { id:21, name:'Gayo Natural Process', subtitle:'Stok 0 — habis',                  badge:'Habis',   badgeClass:'bp-danger',  type:'stock', url:'/products/3/' },
        ],
      };
      const pool = type ? (mock[type] || []) : [...mock.product, ...mock.location, ...mock.stock];
      const q    = term.toLowerCase();
      this.results = pool.filter(p =>
        p.name.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q)
      );
      this.loading = false;
    },

    kbMove(dir) {
      const len = this.results.length;
      if (!len) return;
      this.kbIdx = (this.kbIdx + dir + len) % len;
    },

    onEnter() {
      const hit = this.results[this.kbIdx];
      if (hit) {
        this.selectResult(hit);
      } else {
        this._saveRecent(this.query);
        window.location.href = '/search/?q=' + encodeURIComponent(this.query);
      }
    },

    selectResult(item) {
      this._saveRecent(this.query);
      this.closeSearch();
      if (item.url) window.location.href = item.url;
    },

    _saveRecent(q) {
      if (!q.trim()) return;
      const list = [q, ...this.recent.filter(r => r !== q)].slice(0, 5);
      this.recent = list;
      try { localStorage.setItem('lumra_recent', JSON.stringify(list)); } catch {}
    },

    /* ══ STORE ══ */
    switchStore(store, evt) {
      evt?.stopPropagation();
      this.activeStore = store;
      this.storeOpen   = false;
      window.dispatchEvent(new CustomEvent('lumra:store-changed', { detail: { store } }));
      fetch('/api/switch-store/', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
        body:    JSON.stringify({ store_id: store.id }),
      })
        .then(r => { if (r.ok) location.reload(); })
        .catch(() => location.reload());
    },

    /* ══ THEME ══ */
    toggleTheme() {
      this.theme = this.theme === 'light' ? 'dark' : 'light';
      this._applyTheme(this.theme);
      try { localStorage.setItem('lumra_theme', this.theme); } catch {}
      this.profileOpen = false;
    },

    _applyTheme(t) {
      // DaisyUI: swap data-theme attribute
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      // Also toggle .dark class for Tailwind dark: variants
      document.documentElement.classList.toggle('dark', t === 'dark');
    },

    /* ══ HELPERS ══ */
    notifIconPath(type) {
      return {
        stock:  'M20 7l-8-4-8 4m16 0v10l-8 4m0-14L4 17m8-10v14',
        alert:  'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z',
        report: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
        system: 'M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18',
      }[type] || 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
    },

    notifLabel(type) {
      return { stock: 'Stok', system: 'Sistem', report: 'Laporan', alert: 'Alert' }[type] || 'Info';
    },

    _csrf() {
      const m = document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='));
      return m ? m.trim().split('=')[1] : '';
    },
  };
}
</script>
