<!-- Sidebar Navigation -->
<aside class="bg-base-100 text-base-content sidebar-transition overflow-hidden flex flex-col border-r border-base-300"
        :class="sidebarOpen ? 'w-64' : 'w-16'"
        x-cloak>
    
    <!-- Logo Header -->
    <div class="p-4 border-b border-base-300 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-cube text-white text-sm"></i>
            </div>
            <span x-show="sidebarOpen" x-transition:enter="transition ease-out duration-200"
                  x-transition:enter-start="opacity-0 transform -translate-x-2"
                  x-transition:enter-end="opacity-100 transform translate-x-0"
                  class="font-bold text-lg">Lumra</span>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto p-4">
        <ul class="space-y-2">
            
            <!-- Dashboard -->
            <li>
                <a href="{% url 'dashboard' %}" 
                   class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all hover:bg-base-200"
                   :class="currentPage === 'dashboard' ? 'bg-primary text-primary-content' : ''">
                    <i class="fas fa-home w-5 h-5 flex-shrink-0"></i>
                    <span x-show="sidebarOpen" x-transition:enter="transition ease-out duration-200"
                          x-transition:enter-start="opacity-0 transform -translate-x-2"
                          x-transition:enter-end="opacity-100 transform translate-x-0">Dashboard</span>
                </a>
            </li>
            
            <!-- Section: Operations -->
            <li x-show="sidebarOpen" class="menu-title mt-4">
                <span class="text-xs font-bold tracking-widest uppercase text-base-content/60">Operations</span>
            </li>
        </ul>
    </nav>
</aside>
