{% extends 'base/base_hybrid.html' %}

{% block title %}Record Stock Movement — LUMRA{% endblock %}

{% block extra_css %}
<style>
  [x-cloak] { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-6 lg:px-12 flex items-center justify-center bg-gradient-to-br from-primary/10 to-secondary/10">
  <div class="w-full max-w-4xl mx-auto">
    <div class="card bg-base-100 shadow-2xl border border-primary/20">
      <div class="card-body p-8">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-base-content mb-2">Record Stock Movement</h1>
          <p class="text-base-content/60 text-sm">Catat pergerakan stok masuk atau keluar.</p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6" x-data="stockMovementForm()" x-init="init()">
          {% csrf_token %}
          
          <!-- Movement Type -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
              <label class="label">
                <span class="label-text">Tipe Pergerakan</span>
              </label>
              <select name="movement_type" x-model="form.movement_type" class="select select-bordered select-primary">
                <option value="">Pilih Tipe</option>
                <option value="in">Stock In</option>
                <option value="out">Stock Out</option>
                <option value="transfer">Transfer</option>
                <option value="adjustment">Penyesuaian</option>
              </select>
            </div>
            
            <div class="form-control">
              <label class="label">
                <span class="label-text">Referensi</span>
              </label>
              <input 
                type="text" 
                name="reference" 
                x-model="form.reference" 
                placeholder="INV-001, PO-002, etc."
                class="input input-bordered"
              >
            </div>
          </div>

          <!-- Product Selection -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Produk</span>
            </label>
            <div class="flex gap-2">
              <input 
                type="text" 
                name="product_search" 
                x-model="form.product_search" 
                placeholder="Cari produk..."
                class="input input-bordered flex-1"
                @input.debounce.500ms="searchProducts"
              >
              <button type="button" class="btn btn-ghost" @click="showProductModal()">
                <i class="fas fa-search"></i>
              </button>
            </div>
            <div x-show="selected_product" class="mt-2 p-3 bg-base-200 rounded-lg">
              <p class="text-sm">
                <strong>Produk Dipilih:</strong> 
                <span x-text="selected_product ? selected_product.name : 'Belum dipilih'"></span>
              </p>
            </div>
          </div>

          <!-- Location Selection -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
              <label class="label">
                <span class="label-text">Lokasi Asal</span>
              </label>
              <select name="from_location" x-model="form.from_location" class="select select-bordered">
                <option value="">Pilih Lokasi</option>
                <template x-for="location in locations" :key="location.id">
                  <option :value="location.id" x-text="location.name"></option>
                </template>
              </select>
            </div>
            
            <div class="form-control" x-show="form.movement_type === 'transfer'">
              <label class="label">
                <span class="label-text">Lokasi Tujuan</span>
              </label>
              <select name="to_location" x-model="form.to_location" class="select select-bordered">
                <option value="">Pilih Lokasi</option>
                <template x-for="location in locations" :key="location.id">
                  <option :value="location.id" x-text="location.name"></option>
                </template>
              </select>
            </div>
          </div>

          <!-- Quantity -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Jumlah</span>
            </label>
            <input 
              type="number" 
              name="quantity" 
              x-model="form.quantity" 
              min="1"
              class="input input-bordered"
              required
            >
          </div>

          <!-- Unit Cost -->
          <div class="form-control" x-show="form.movement_type === 'in'">
            <label class="label">
              <span class="label-text">Harga per Unit</span>
            </label>
            <input 
              type="number" 
              name="unit_cost" 
              x-model="form.unit_cost" 
              step="0.01"
              class="input input-bordered"
            >
          </div>

          <!-- Notes -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Catatan</span>
            </label>
            <textarea 
              name="notes" 
              x-model="form.notes" 
              rows="3"
              placeholder="Catatan tambahan..."
              class="textarea textarea-bordered"
            ></textarea>
          </div>

          <!-- Form Actions -->
          <div class="flex gap-4">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save mr-2"></i>
              Simpan Pergerakan
            </button>
            <button type="button" @click="resetForm()" class="btn btn-ghost">
              <i class="fas fa-redo mr-2"></i>
              Reset
            </button>
            <a href="{% url 'inventory:stock_movement_list' %}" class="btn btn-ghost">
              <i class="fas fa-times mr-2"></i>
              Batal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Product Search Modal -->
<div class="modal" :class="showProductModal ? 'modal-open' : ''">
  <div class="modal-box">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="font-bold text-lg">Pilih Produk</h3>
        <button class="btn btn-ghost btn-sm" @click="closeProductModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-control">
          <input 
            type="text" 
            x-model="product_search_modal" 
            placeholder="Cari produk..."
            class="input input-bordered"
            @input.debounce.500ms="searchProductsModal"
          >
        </div>
        <div class="max-h-60 overflow-y-auto">
          <template x-for="product in filtered_products_modal" :key="product.id">
            <div class="p-3 hover:bg-base-200 cursor-pointer border-b" @click="selectProduct(product)">
              <div class="flex justify-between items-center">
                <div>
                  <p class="font-semibold" x-text="product.name"></p>
                  <p class="text-sm text-base-content/60" x-text="product.sku"></p>
                </div>
                <div class="text-sm text-base-content/60">
                  <span x-text="product.stock"></span> units
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function stockMovementForm() {
  return {
    movement_type: '',
    reference: '',
    from_location: '',
    to_location: '',
    quantity: 1,
    unit_cost: 0,
    notes: '',
    product_search: '',
    selected_product: null,
    showProductModal: false,
    product_search_modal: '',
    filtered_products_modal: [],
    locations: [],
    products: [],
    
    init() {
      this.loadLocations();
      this.loadProducts();
    },
    
    loadLocations() {
      // Mock data - replace with actual API call
      this.locations = [
        { id: 1, name: 'Gudang Utama' },
        { id: 2, name: 'Gudang B' },
        { id: 3, name: 'Toko Cabang' }
      ];
    },
    
    loadProducts() {
      // Mock data - replace with actual API call
      this.products = [
        { id: 1, name: 'Produk A', sku: 'PRD-001', stock: 100 },
        { id: 2, name: 'Produk B', sku: 'PRD-002', stock: 50 },
        { id: 3, name: 'Produk C', sku: 'PRD-003', stock: 75 }
      ];
    },
    
    searchProducts() {
      if (this.product_search) {
        this.filtered_products_modal = this.products.filter(product => 
          product.name.toLowerCase().includes(this.product_search.toLowerCase()) ||
          product.sku.toLowerCase().includes(this.product_search.toLowerCase())
        );
      } else {
        this.filtered_products_modal = [...this.products];
      }
    },
    
    searchProductsModal() {
      if (this.product_search_modal) {
        this.filtered_products_modal = this.products.filter(product => 
          product.name.toLowerCase().includes(this.product_search_modal.toLowerCase()) ||
          product.sku.toLowerCase().includes(this.product_search_modal.toLowerCase())
        );
      } else {
        this.filtered_products_modal = [...this.products];
      }
    },
    
    showProductModal() {
      this.showProductModal = true;
      this.product_search_modal = '';
      this.filtered_products_modal = [...this.products];
    },
    
    closeProductModal() {
      this.showProductModal = false;
      this.product_search_modal = '';
    },
    
    selectProduct(product) {
      this.selected_product = product;
      this.product_search = product.name;
      this.closeProductModal();
    },
    
    resetForm() {
      this.movement_type = '';
      this.reference = '';
      this.from_location = '';
      this.to_location = '';
      this.quantity = 1;
      this.unit_cost = 0;
      this.notes = '';
      this.selected_product = null;
      this.product_search = '';
    }
  }
}
</script>
{% endblock %}
