{% extends 'base/base_hybrid.html' %}

{% block title %}Access Denied - Lumra ERP{% endblock %}

{% block content %}

<div class="min-h-screen py-12 px-6 lg:px-12 flex items-center justify-center bg-gradient-to-br from-error/10 to-warning/10">
  <div class="max-w-md mx-auto text-center">
    <div class="card bg-base-100 shadow-2xl border border-error/20">
      <div class="card-body p-8">
        <!-- Error Icon -->
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-error/10 flex items-center justify-center">
          <i class="fas fa-lock text-error text-3xl"></i>
        </div>
        
        <!-- Error Code -->
        <h1 class="text-6xl font-bold text-error mb-4">403</h1>
        
        <!-- Error Title -->
        <h2 class="text-2xl text-base-content font-semibold mb-2">Access Denied</h2>
        
        <!-- Error Message -->
        <p class="text-base-content/60 mb-8">You do not have permission to access this resource.</p>
        
        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <a href="{% url 'dashboard' %}" class="btn btn-primary">
            <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
          </a>
          <button onclick="history.back()" class="btn btn-ghost">
            <i class="fas fa-arrow-right mr-2"></i> Go Back
          </button>
        </div>
        
        <!-- Help Section -->
        <div class="mt-8 p-4 bg-base-200 rounded-lg">
          <p class="text-sm text-base-content/60">
            <i class="fas fa-info-circle mr-2"></i>
            If you believe this is an error, please contact your system administrator.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
