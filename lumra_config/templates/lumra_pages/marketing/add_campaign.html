{% extends 'base/base_hybrid.html' %}

{% block title %}Tambah Campaign — LUMRA{% endblock %}

{% block extra_css %}
<style>
  [x-cloak] { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-6 lg:px-12 flex items-center justify-center bg-gradient-to-br from-primary/10 to-secondary/10">
  <div class="w-full max-w-4xl mx-auto">
    <div class="card bg-base-100 shadow-2xl border border-primary/20">
      <div class="card-body p-8">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-base-content mb-2">Tambah Campaign</h1>
          <p class="text-base-content/60 text-sm">Buat campaign marketing baru.</p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6" x-data="campaignForm()" x-init="init()">
          {% csrf_token %}
          
          <!-- Campaign Info -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
              <label class="label">
                <span class="label-text">Nama Campaign</span>
              </label>
              <input 
                type="text" 
                name="name" 
                x-model="form.name" 
                placeholder="Nama campaign"
                class="input input-bordered input-primary"
                required
              >
            </div>
            
            <div class="form-control">
              <label class="label">
                <span class="label-text">Tipe Campaign</span>
              </label>
              <select name="type" x-model="form.type" class="select select-bordered select-primary">
                <option value="">Pilih Tipe</option>
                <option value="discount">Diskon</option>
                <option value="voucher">Voucher</option>
                <option value="promotion">Promosi</option>
                <option value="loyalty">Loyalty</option>
              </select>
            </div>
          </div>

          <!-- Date Range -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
              <label class="label">
                <span class="label-text">Tanggal Mulai</span>
              </label>
              <input 
                type="datetime-local" 
                name="start_date" 
                x-model="form.start_date" 
                class="input input-bordered"
                required
              >
            </div>
            
            <div class="form-control">
              <label class="label">
                <span class="label-text">Tanggal Selesai</span>
              </label>
              <input 
                type="datetime-local" 
                name="end_date" 
                x-model="form.end_date" 
                class="input input-bordered"
                required
              >
            </div>
          </div>

          <!-- Target Audience -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Target Audience</span>
            </label>
            <div class="space-y-2">
              <label class="cursor-pointer">
                <input type="checkbox" x-model="form.target_all" class="checkbox checkbox-primary">
                <span class="label-text">Semua Pelanggan</span>
              </label>
              <div x-show="!form.target_all">
                <template x-for="segment in segments" :key="segment.id">
                  <label class="cursor-pointer">
                    <input type="checkbox" :value="segment.id" x-model="form.target_segments" class="checkbox">
                    <span class="label-text" x-text="segment.name"></span>
                  </label>
                </template>
              </div>
            </div>
          </div>

          <!-- Campaign Content -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Deskripsi</span>
            </label>
            <textarea 
              name="description" 
              x-model="form.description" 
              rows="4"
              placeholder="Deskripsi campaign..."
              class="textarea textarea-bordered"
            ></textarea>
          </div>

          <!-- Campaign Settings -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Pengaturan Campaign</span>
            </label>
            <div class="card bg-base-200 border border-base-300 p-4">
              <div class="space-y-4">
                <!-- Budget -->
                <div class="form-control">
                  <label class="label">
                    <span class="label-text">Budget</span>
                  </label>
                  <input 
                    type="number" 
                    name="budget" 
                    x-model="form.budget" 
                    step="0.01"
                    placeholder="0.00"
                    class="input input-bordered"
                  >
                </div>

                <!-- Discount Type (for discount campaigns) -->
                <div class="form-control" x-show="form.type === 'discount'">
                  <label class="label">
                    <span class="label-text">Tipe Diskon</span>
                  </label>
                  <select x-model="form.discount_type" class="select select-bordered">
                    <option value="percentage">Persentase</option>
                    <option value="fixed">Nominal Tetap</option>
                  </select>
                </div>

                <!-- Discount Value -->
                <div class="form-control" x-show="form.type === 'discount'">
                  <label class="label">
                    <span class="label-text">Nilai Diskon</span>
                  </label>
                  <input 
                    type="number" 
                    name="discount_value" 
                    x-model="form.discount_value" 
                    step="0.01"
                    placeholder="0.00"
                    class="input input-bordered"
                  >
                </div>

                <!-- Minimum Purchase -->
                <div class="form-control" x-show="form.type === 'discount' || form.type === 'voucher'">
                  <label class="label">
                    <span class="label-text">Minimum Pembelian</span>
                  </label>
                  <input 
                    type="number" 
                    name="min_purchase" 
                    x-model="form.min_purchase" 
                    step="0.01"
                    placeholder="0.00"
                    class="input input-bordered"
                  >
                </div>

                <!-- Usage Limit -->
                <div class="form-control">
                  <label class="label">
                    <span class="label-text">Batas Penggunaan</span>
                  </label>
                  <input 
                    type="number" 
                    name="usage_limit" 
                    x-model="form.usage_limit" 
                    min="1"
                    placeholder="0 (tanpa batas)"
                    class="input input-bordered"
                  >
                </div>
              </div>
            </div>
          </div>

          <!-- Status -->
          <div class="form-control">
            <label class="label cursor-pointer">
              <input type="checkbox" name="is_active" x-model="form.is_active" class="checkbox checkbox-primary">
              <span class="label-text">Aktif</span>
            </label>
          </div>

          <!-- Form Actions -->
          <div class="flex gap-4">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save mr-2"></i>
              Simpan Campaign
            </button>
            <button type="button" @click="resetForm()" class="btn btn-ghost">
              <i class="fas fa-redo mr-2"></i>
              Reset
            </button>
            <a href="{% url 'marketing:campaign_list' %}" class="btn btn-ghost">
              <i class="fas fa-times mr-2"></i>
              Batal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function campaignForm() {
  return {
    form: {
      name: '',
      type: '',
      start_date: '',
      end_date: '',
      target_all: true,
      target_segments: [],
      description: '',
      budget: 0,
      discount_type: 'percentage',
      discount_value: 0,
      min_purchase: 0,
      usage_limit: 0,
      is_active: true
    },
    segments: [],
    
    init() {
      this.loadSegments();
    },
    
    loadSegments() {
      // Mock data - replace with actual API call
      this.segments = [
        { id: 1, name: 'Pelanggan Baru' },
        { id: 2, name: 'Pelanggan Setia' },
        { id: 3, name: 'Pelanggan VIP' },
        { id: 4, name: 'Pelanggan Tidak Aktif' }
      ];
    },
    
    resetForm() {
      this.form = {
        name: '',
        type: '',
        start_date: '',
        end_date: '',
        target_all: true,
        target_segments: [],
        description: '',
        budget: 0,
        discount_type: 'percentage',
        discount_value: 0,
        min_purchase: 0,
        usage_limit: 0,
        is_active: true
      };
    }
  }
}
</script>
{% endblock %}
