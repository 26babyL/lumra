{# DASHBOARD LAYOUT — DaisyUI Version #}

<style>
  .dashboard-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  @media (min-width: 768px) {
    .dashboard-container {
      gap: 24px;
    }
  }

  .dashboard-main {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 1024px) {
    .dashboard-main {
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
  }

  .dashboard-primary {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .dashboard-sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .dashboard-section-wrapper {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .dashboard-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
  }
</style>

<div class="dashboard-container p-6">
  <!-- Greeting -->
  {% include 'components/greeting_section.html' %}

  <!-- Main Grid -->
  <div class="dashboard-main">
    <!-- Primary Column -->
    <div class="dashboard-primary">
      {% block dashboard_main %}{% endblock %}
    </div>

    <!-- Sidebar Column -->
    <div class="dashboard-sidebar">
      {% block dashboard_sidebar %}{% endblock %}
    </div>
  </div>
</div>
