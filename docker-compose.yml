version: '3.9'

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:15-alpine
    container_name: lumra_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lumra_set_allegra}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=id_ID.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d/  # Custom SQL scripts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lumra_set_allegra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lumra_network
    restart: unless-stopped
    # Performance tuning untuk high-load scenarios
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=200"

  # ============ Redis Cache & Message Broker ============
  redis:
    image: redis:7-alpine
    container_name: lumra_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lumra_network
    restart: unless-stopped

  # ============ MeiliSearch (Full-text Search) ============
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: lumra_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-masterKey}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lumra_network
    restart: unless-stopped

  # ============ Django Application (WSGI) ============
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumra_django
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn lumra_system.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class sync
      --worker-tmp-dir /dev/shm
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 60
      --access-logfile -
      --error-logfile -
      "
    environment:
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lumra_set_allegra}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-masterKey}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - lumra_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ Django Channels (WebSockets & ASGI) ============
  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumra_daphne
    command: >
      daphne -b 0.0.0.0 -p 8001
      lumra_system.asgi:application
      --access-log -
    environment:
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lumra_set_allegra}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CHANNEL_LAYERS_HOST: redis
      CHANNEL_LAYERS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - .:/app
      - logs_volume:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumra_network
    restart: unless-stopped

  # ============ Celery Worker (Background Tasks) ============
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumra_celery_worker
    command: >
      celery -A lumra_system worker
      -l info
      --concurrency=4
      --max-tasks-per-child=100
      --time-limit=3600
      --soft-time-limit=3300
    environment:
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lumra_set_allegra}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
    volumes:
      - .:/app
      - logs_volume:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumra_network
    restart: unless-stopped

  # ============ Celery Beat (Task Scheduler) ============
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumra_celery_beat
    command: >
      celery -A lumra_system beat
      -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lumra_set_allegra}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
    volumes:
      - .:/app
      - logs_volume:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumra_network
    restart: unless-stopped

  # ============ Nginx Reverse Proxy ============
  nginx:
    image: nginx:alpine
    container_name: lumra_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - daphne
    networks:
      - lumra_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local

networks:
  lumra_network:
    driver: bridge
