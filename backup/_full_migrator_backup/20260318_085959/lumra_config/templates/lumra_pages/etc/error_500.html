<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error - Lumra ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-green-50 to-teal-50 flex items-center justify-center px-6">
    <div class="max-w-md w-full rounded-2xl shadow-xl border border-emerald-100 p-8 text-center" style="background:var(--color-surface)">
        <div class="mb-6">
            <i class="fas fa-exclamation-triangle text-6xl text-red-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Oops! Something went wrong</h1>
        <p class="text-gray-600 mb-6">We're sorry, but an internal server error occurred. Our team has been notified and is working to fix it.</p>
        <div class="space-y-4">
            <a href="{% url 'dashboard' %}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 shadow-md inline-block">
                🏠 Back to Home
            </a>
            <div class="text-sm text-gray-500">
                <p>If the problem persists, contact support:</p>
                <p><i class="fas fa-envelope"></i> support@lumraerp.com</p>
                <p><i class="fas fa-phone"></i> +62 123 456 789</p>
            </div>
        </div>
    </div>
</body>
</html>
