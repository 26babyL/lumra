<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Lumra ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-green-50 to-teal-50 flex items-center justify-center px-6">
    <div class="max-w-md w-full rounded-2xl shadow-xl border border-emerald-100 p-8 text-center" style="background:var(--color-surface)">
        <div class="mb-6">
            <i class="fas fa-search text-6xl text-emerald-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Page Not Found</h1>
        <p class="text-gray-600 mb-6">The page you're looking for doesn't exist. Try searching for what you need.</p>
        <div class="space-y-4">
            <form method="get" action="{% url 'search' %}" class="flex gap-2">
                <input type="text" name="q" placeholder="Search..." class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors duration-200" style="background:var(--color-surface)">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 shadow-md">
                    🔍
                </button>
            </form>
            <a href="{% url 'dashboard' %}" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 shadow-md inline-block">
                🏠 Back to Home
            </a>
        </div>
    </div>
</body>
</html>
